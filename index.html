<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТЫ ТОЛСТЯК</title>
    <!-- Подключаем красивый и жирный современный шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Интерактивный фон с плавной переливающейся градиентной анимацией */
        .bg-gradient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, #ff007f, #7928ca, #4facfe, #00f2fe, #ff007f);
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
            z-index: 1;
            opacity: 0.85;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Свечение за курсором мыши для интерактивности */
        .cursor-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 2;
            transition: width 0.2s, height 0.2s;
        }

        /* Стильный контейнер для текста с эффектом стекла (Glassmorphism) */
        .content-container {
            position: relative;
            z-index: 3;
            text-align: center;
            padding: 40px 80px;
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            animation: floatContainer 4s ease-in-out infinite;
        }

        @keyframes floatContainer {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        /* Надпись на весь экран */
        h1 {
            font-size: clamp(3rem, 8vw, 8.5rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
            /* Мульти-тень для объемного неонового свечения */
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5),
                         0 0 40px rgba(255, 255, 255, 0.6),
                         0 0 80px rgba(121, 40, 202, 0.5);
            user-select: none;
            transition: transform 0.2s ease;
        }

        h1:hover {
            transform: scale(1.03);
        }

        /* Небольшой подзаголовок для уюта */
        .subtitle {
            margin-top: 15px;
            font-size: clamp(0.9rem, 1.5vw, 1.2rem);
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Переливающийся фон -->
    <div class="bg-gradient"></div>

    <!-- Интерактивный элемент под курсором -->
    <div class="cursor-glow" id="cursorGlow"></div>

    <!-- Основной блок с текстом -->
    <div class="content-container">
        <h1>ТЫ ТОЛСТЯК</h1>
        <div class="subtitle">Интерактивный шедевр</div>
    </div>

    <script>
        // Плавное следование светового пятна за курсором мыши
        const glow = document.getElementById('cursorGlow');
        
        window.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            
            glow.style.left = x + 'px';
            glow.style.top = y + 'px';
        });
    </script>
</body>
</html>
